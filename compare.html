<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビフォー・アフター比較</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      background: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #16213e;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 1px solid #0f3460;
    }

    .header h1 {
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
    }

    .header .meta {
      font-size: 12px;
      color: #8899aa;
    }

    .header .spacer { flex: 1; }

    .header a {
      font-size: 12px;
      color: #64b5f6;
      text-decoration: none;
      white-space: nowrap;
    }

    .header a:hover { text-decoration: underline; }

    .frames {
      display: flex;
      flex: 1;
      overflow: hidden;
      user-select: none;
    }

    .frame-wrap {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .frame-label {
      padding: 7px 16px;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    .frame-label.before {
      background: #3d1010;
      color: #ff8a80;
      border-bottom: 2px solid #b71c1c;
    }

    .frame-label.after {
      background: #0d3318;
      color: #69f0ae;
      border-bottom: 2px solid #1b5e20;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: white;
    }

    .divider {
      width: 6px;
      background: #0f3460;
      cursor: ew-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .divider:hover, .divider.active {
      background: #1a73e8;
    }

    .divider::after {
      content: "⋮⋮";
      color: #ffffff44;
      font-size: 14px;
      writing-mode: vertical-rl;
      letter-spacing: -4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ビフォー・アフター比較</h1>
    <span class="meta">研修用UXフォーム改善</span>
    <div class="spacer"></div>
    <a href="index.html" target="_blank">改善後フォームを開く →</a>
  </div>

  <div class="frames" id="frames">
    <div class="frame-wrap" id="left-frame">
      <div class="frame-label before">改善前（original.html）</div>
      <iframe src="original.html" title="改善前フォーム"></iframe>
    </div>

    <div class="divider" id="divider"></div>

    <div class="frame-wrap" id="right-frame">
      <div class="frame-label after">改善後（index.html）</div>
      <iframe src="index.html" title="改善後フォーム"></iframe>
    </div>
  </div>

  <script>
    const divider = document.getElementById('divider');
    const frames = document.getElementById('frames');
    const leftFrame = document.getElementById('left-frame');
    const rightFrame = document.getElementById('right-frame');

    let dragging = false;

    divider.addEventListener('mousedown', e => {
      dragging = true;
      divider.classList.add('active');
      e.preventDefault();
    });

    document.addEventListener('mouseup', () => {
      dragging = false;
      divider.classList.remove('active');
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const rect = frames.getBoundingClientRect();
      const dividerWidth = divider.offsetWidth;
      const ratio = (e.clientX - rect.left - dividerWidth / 2) / (rect.width - dividerWidth);
      const clamped = Math.min(0.8, Math.max(0.2, ratio));
      leftFrame.style.flex = `0 0 ${clamped * 100}%`;
      rightFrame.style.flex = `0 0 ${(1 - clamped) * 100}%`;
    });

    // タッチ対応
    divider.addEventListener('touchstart', e => {
      dragging = true;
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', () => { dragging = false; });

    document.addEventListener('touchmove', e => {
      if (!dragging) return;
      const touch = e.touches[0];
      const rect = frames.getBoundingClientRect();
      const ratio = (touch.clientX - rect.left) / rect.width;
      const clamped = Math.min(0.8, Math.max(0.2, ratio));
      leftFrame.style.flex = `0 0 ${clamped * 100}%`;
      rightFrame.style.flex = `0 0 ${(1 - clamped) * 100}%`;
    }, { passive: false });
  </script>
</body>
</html>
