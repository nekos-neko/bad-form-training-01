<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビフォー・アフター比較</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      background: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #16213e;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 1px solid #0f3460;
    }

    .header h1    { font-size: 15px; font-weight: bold; white-space: nowrap; }
    .header .meta { font-size: 12px; color: #8899aa; }
    .header .spacer { flex: 1; }

    .btn-reload {
      font-size: 12px;
      padding: 5px 12px;
      background: #0f3460;
      color: #64b5f6;
      border: 1px solid #1a73e8;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-reload:hover { background: #1a73e8; color: white; }

    .frames {
      display: flex;
      flex: 1;
      overflow: hidden;
      user-select: none;
    }

    .frame-wrap {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .frame-label {
      padding: 7px 16px;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    .frame-label.before {
      background: #3d1010;
      color: #ff8a80;
      border-bottom: 2px solid #b71c1c;
    }

    .frame-label.after {
      background: #0d3318;
      color: #69f0ae;
      border-bottom: 2px solid #1b5e20;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: white;
    }

    .divider {
      width: 6px;
      background: #0f3460;
      cursor: ew-resize;
      flex-shrink: 0;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .divider:hover, .divider.active { background: #1a73e8; }
    .divider::after {
      content: "⋮⋮";
      color: #ffffff44;
      font-size: 14px;
      writing-mode: vertical-rl;
      letter-spacing: -4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ビフォー・アフター比較</h1>
    <span class="meta" id="session-meta"></span>
    <div class="spacer"></div>
    <button class="btn-reload" onclick="loadAfter()">🔄 アフターを更新</button>
  </div>

  <div class="frames" id="frames">
    <div class="frame-wrap" id="left-frame">
      <div class="frame-label before">改善前（original.html）</div>
      <iframe src="original.html" title="改善前フォーム"></iframe>
    </div>

    <div class="divider" id="divider"></div>

    <div class="frame-wrap" id="right-frame">
      <div class="frame-label after">改善後（現在のセッション）</div>
      <iframe id="after-frame" title="改善後フォーム"></iframe>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://bad-form-training-worker.kanekooo-jr.workers.dev';
    const sessionId  = new URLSearchParams(location.search).get('s');

    if (sessionId) {
      document.getElementById('session-meta').textContent = `SESSION: ${sessionId}`;
    }

    async function loadAfter() {
      if (!sessionId) {
        document.getElementById('after-frame').srcdoc =
          '<p style="padding:20px;color:#999;">URLにセッションIDが含まれていません。</p>';
        return;
      }
      try {
        const res  = await fetch(`${WORKER_URL}/session/${sessionId}`);
        if (!res.ok) throw new Error(`${res.status}`);
        const html = await res.text();
        const blob = new Blob([html], { type: 'text/html' });
        const frame = document.getElementById('after-frame');
        if (frame.src.startsWith('blob:')) URL.revokeObjectURL(frame.src);
        frame.src = URL.createObjectURL(blob);
      } catch(e) {
        document.getElementById('after-frame').srcdoc =
          `<p style="padding:20px;color:#c62828;">読み込みエラー: ${e.message}</p>`;
      }
    }

    // 初回読み込み
    loadAfter();

    // ===== ドラッグで分割幅を変更 =====
    const divider   = document.getElementById('divider');
    const frames    = document.getElementById('frames');
    const leftFrame = document.getElementById('left-frame');
    const rightFrame = document.getElementById('right-frame');
    let dragging = false;

    divider.addEventListener('mousedown', e => {
      dragging = true;
      divider.classList.add('active');
      e.preventDefault();
    });
    document.addEventListener('mouseup', () => {
      dragging = false;
      divider.classList.remove('active');
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const rect   = frames.getBoundingClientRect();
      const dw     = divider.offsetWidth;
      const ratio  = (e.clientX - rect.left - dw / 2) / (rect.width - dw);
      const clamped = Math.min(0.8, Math.max(0.2, ratio));
      leftFrame.style.flex  = `0 0 ${clamped * 100}%`;
      rightFrame.style.flex = `0 0 ${(1 - clamped) * 100}%`;
    });

    // タッチ対応
    divider.addEventListener('touchstart', e => { dragging = true; e.preventDefault(); }, { passive: false });
    document.addEventListener('touchend',  () => { dragging = false; });
    document.addEventListener('touchmove', e => {
      if (!dragging) return;
      const touch   = e.touches[0];
      const rect    = frames.getBoundingClientRect();
      const ratio   = (touch.clientX - rect.left) / rect.width;
      const clamped = Math.min(0.8, Math.max(0.2, ratio));
      leftFrame.style.flex  = `0 0 ${clamped * 100}%`;
      rightFrame.style.flex = `0 0 ${(1 - clamped) * 100}%`;
    }, { passive: false });
  </script>
</body>
</html>
