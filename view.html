<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研修用フォーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      background: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .bar {
      background: #16213e;
      color: white;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid #0f3460;
    }

    .bar h1 { font-size: 14px; font-weight: bold; white-space: nowrap; }
    .bar .session-badge {
      font-size: 11px;
      color: #8899aa;
      font-family: monospace;
    }
    .bar .spacer { flex: 1; }
    .bar .update-time { font-size: 11px; color: #8899aa; }

    .btn-reload {
      font-size: 12px;
      padding: 5px 12px;
      background: #0f3460;
      color: #64b5f6;
      border: 1px solid #1a73e8;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-reload:hover { background: #1a73e8; color: white; }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: white;
    }

    .error-screen {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #ff8a80;
    }
    .error-screen p { font-size: 14px; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>研修用フォーム</h1>
    <span class="session-badge" id="session-badge"></span>
    <div class="spacer"></div>
    <span class="update-time" id="update-time"></span>
    <button class="btn-reload" onclick="loadFrame()">🔄 更新</button>
  </div>

  <iframe id="frame" title="研修用フォーム"></iframe>
  <div class="error-screen" id="error-screen">
    <p id="error-msg"></p>
  </div>

  <script>
    const WORKER_URL = 'https://bad-form-training-worker.kanekooo-jr.workers.dev';
    const sessionId  = new URLSearchParams(location.search).get('s');

    document.getElementById('session-badge').textContent = sessionId ? `SESSION: ${sessionId}` : '';

    async function loadFrame() {
      if (!sessionId) {
        showError('URLにセッションIDが含まれていません。講師から受け取ったURLを使用してください。');
        return;
      }

      try {
        const res = await fetch(`${WORKER_URL}/session/${sessionId}`);
        if (!res.ok) {
          showError(`セッションが見つかりません（${res.status}）`);
          return;
        }

        const html = await res.text();
        const blob = new Blob([html], { type: 'text/html' });

        // 古いblob URLを解放
        const frame = document.getElementById('frame');
        if (frame.src.startsWith('blob:')) {
          URL.revokeObjectURL(frame.src);
        }

        frame.src = URL.createObjectURL(blob);
        document.getElementById('frame').style.display = 'block';
        document.getElementById('error-screen').style.display = 'none';
        document.getElementById('update-time').textContent =
          '更新: ' + new Date().toLocaleTimeString('ja-JP');
      } catch(e) {
        showError(`読み込みエラー: ${e.message}`);
      }
    }

    function showError(msg) {
      document.getElementById('frame').style.display         = 'none';
      document.getElementById('error-screen').style.display  = 'flex';
      document.getElementById('error-msg').textContent       = msg;
    }

    // 初回読み込み
    loadFrame();
  </script>
</body>
</html>
